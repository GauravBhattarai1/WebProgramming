<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Servicing Form</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            width: 400px;
            max-width: 100%;
            margin-top: 20px;
        }

        .topnav {
            background-color: red;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .topnav a {
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            flex: 1 0 100px;
        }

        .topnav a:hover {
            background-color: darkred;
        }

        h1 {
            color: #ff0000;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            color: #ff0000;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #ff0000;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc0000;
        }

        @media (max-width: 768px) {
            .topnav a {
                flex: 1 0 80px;
            }
        }

        @media (max-width: 600px) {
            .topnav {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="topnav">
        <a href="file:///C:/Users/bhatt/Desktop/get/WebProgramming/motorcycle.html">Motorcycles</a>
        <a href="file:///C:/Users/bhatt/Desktop/get/WebProgramming/Accessories.html">Accessories</a>
        <a href="file:///C:/Users/bhatt/Desktop/get/WebProgramming/services.html">Services</a>
        <a href="file:///C:/Users/bhatt/Desktop/get/WebProgramming/aboutus.html">About</a>
    </div>

    <!-- Bike Servicing Form Container -->
    <div class="container">
        <h1>Bike Servicing Form</h1>
        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="bike-model">Bike Model</label>
            <input type="text" id="bike-model" name="bike-model" required>

            <label for="service-type">Service Type</label>
            <select id="service-type" name="service-type" required>
                <option value="basic">Basic Service</option>
                <option value="full">Full Service</option>
                <option value="engine">Engine Service</option>
                <option value="custom">Custom Service</option>
            </select>

            <label for="service-date">Preferred Service Date</label>
            <input type="date" id="service-date" name="service-date" required>

            <label for="comments">Additional Comments</label>
            <textarea id="comments" name="comments" rows="4"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
